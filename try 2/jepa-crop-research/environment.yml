# conda env create -f environment.yml && conda activate jepa-crop
# Then install PyTorch with pip using the command from https://pytorch.org/get-started/locally/
# (choose pip + your CUDA version), and register the kernel:
#   python -m ipykernel install --user --name jepa-crop
name: jepa-crop
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=1.5
  - scikit-learn>=1.2
  - matplotlib>=3.6
  - psutil>=5.9
  - ipykernel>=6.0
  - jupyterlab>=4.0
